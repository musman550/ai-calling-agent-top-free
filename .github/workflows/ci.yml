name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test tools (jsdom is only used by the tests)
        run: npm i --no-save --no-audit --no-fund jsdom

      # Runs: serverless backend tests, maintenance-script tests, and the dashboard in a simulated browser.
      # A broken push is caught here BEFORE anyone depends on it.
      - name: Run all tests
        run: node tests/run.js

      # Auto-report: a failing push opens (or updates) ONE issue with the run link ...
      - name: Open an issue if the tests failed
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🔴 Tests are failing on main";
            const body = `The latest push broke the tests.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nCommit: ${context.sha}\n\nTo get it fixed: open a fresh Claude chat, paste this issue link and ask it to fix the failing test.`;
            const open = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "auto-check"});
            const existing = open.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["auto-check"]});
            }

      # ... and closes it by itself once a later push is green again.
      - name: Close the issue once tests are green again
        if: success() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "auto-check"});
            for (const issue of open.data) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: `Fixed as of ${context.sha}.`});
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: "closed"});
            }
