name: Weekly maintenance

# Every Monday: re-test the whole repo, re-check every public link, fetch this week's
# voice-agent trends, optionally ask an open-source model (served by Groq, the fastest
# inference) for improvement ideas, and publish ONE report issue.
# It never edits your code on its own — fixes and features stay under your control.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install test tools
        run: npm i --no-save --no-audit --no-fund jsdom

      - name: Run all tests
        shell: bash
        continue-on-error: true
        run: node tests/run.js 2>&1 | tee test-output.txt

      - name: Check every public link
        shell: bash
        continue-on-error: true
        run: node scripts/check_links.js 2>&1 | tee links-output.txt

      - name: Fetch trends
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/trends.js > trends.md

      - name: Build the report (AI review only if the GROQ_API_KEY secret exists)
        id: report
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/weekly_report.js

      - name: Publish the report as an issue
        uses: actions/github-script@v7
        env:
          HEALTHY: ${{ steps.report.outputs.healthy }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8').slice(0, 60000);
            const healthy = process.env.HEALTHY === 'true';
            const date = new Date().toISOString().slice(0, 10);
            const old = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'weekly-report'});
            for (const i of old.data) {
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number, state: 'closed'});
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `${healthy ? '📊' : '🔴'} Weekly report — ${date}`,
              body,
              labels: healthy ? ['weekly-report'] : ['weekly-report', 'needs-attention'],
            });

      - name: Mark the run red when something is unhealthy (so GitHub emails you)
        if: steps.report.outputs.healthy != 'true'
        run: |
          echo "Weekly health check found problems — see the report issue."
          exit 1
